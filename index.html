<style>
  @font-face{
    font-family:'MinecraftFive';
    src:url('assets/fonts/MinecraftFiveBold.otf') format('opentype');
    font-weight:700;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --bg:            #0b0d11;
    --panel:         #12151c;
    --panel-2:       #171b23;
    --border:        #2a3138;
    --border-soft:   #232830;
    --text:          #e4eaef;
    --text-dim:      #93a8b5;
    --text-faint:    #5b6d78;
    --accent:        #e3a857;
    --accent-soft:   rgba(227,168,87,.14);
    --ok:            #7fbf8f;
    --ease: cubic-bezier(.22,.85,.32,1);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'MinecraftFive', ui-monospace, monospace;
    -webkit-font-smoothing:none;
    font-smooth:never;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    position:relative;
    overflow-x:hidden;
    cursor:default;
  }

  /* pixel cursor */
  body, a, button, input{
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 20 20'><g fill='%23e4eaef' stroke='%230b0d11' stroke-width='1'><rect x='2' y='2' width='2' height='2'/><rect x='2' y='4' width='2' height='2'/><rect x='2' y='6' width='2' height='2'/><rect x='2' y='8' width='2' height='2'/><rect x='2' y='10' width='2' height='2'/><rect x='4' y='4' width='2' height='2'/><rect x='4' y='6' width='2' height='2'/><rect x='4' y='8' width='2' height='2'/><rect x='6' y='6' width='2' height='2'/><rect x='6' y='8' width='2' height='2'/><rect x='4' y='10' width='2' height='2'/><rect x='6' y='11' width='2' height='2'/></g></svg>") 2 2, auto;
  }

  .bg-grid{
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size:42px 42px;
    opacity:.3;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 90%);
    pointer-events:none;
    animation:gridshift 30s linear infinite;
  }
  @keyframes gridshift{ from{ background-position:0 0, 0 0; } to{ background-position:42px 84px, 42px 84px; } }
  .bg-glow{
    position:fixed; top:-10%; right:-10%; width:60vmax; height:60vmax;
    background:radial-gradient(circle, rgba(227,168,87,.10) 0%, transparent 65%);
    filter:blur(10px); pointer-events:none;
    animation:drift 20s ease-in-out infinite alternate;
  }
  @keyframes drift{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(-5%, 5%) scale(1.08); } }
  .bg-vignette{
    position:fixed; inset:0;
    background:radial-gradient(ellipse 90% 80% at 50% 40%, transparent 55%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
  }
  #particles{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:1; }
  .particle{
    position:absolute; bottom:-10px; width:3px; height:3px;
    background:var(--accent); opacity:0; animation:rise linear infinite;
    will-change: transform, opacity;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.5; } 90%{ opacity:.35; }
    100%{ transform:translateY(-100vh) translateX(var(--drift,20px)); opacity:0; }
  }

  /* mouse trail — single canvas, no DOM churn */
  #trail{ position:fixed; inset:0; pointer-events:none; z-index:9998; }

  .stage{
    display:flex; align-items:flex-start; justify-content:center;
    gap:18px; width:100%; max-width:820px; position:relative; z-index:2;
    transition: gap .5s var(--ease);
  }
  .main-col{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    width:100%; max-width:560px;
    transition: max-width .5s var(--ease), transform .5s var(--ease);
  }
  /* when the ad panel is dismissed, let the terminal breathe a little wider and settle center */
  .stage.ad-closed{ gap:0; }
  .stage.ad-closed .main-col{ max-width:600px; }

  .term{
    position:relative; width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.02) inset;
    overflow:hidden;
    animation:rise-in .6s var(--ease) both;
    transform-style:preserve-3d;
    transition:transform .25s var(--ease);
    will-change:transform;
  }
  @keyframes rise-in{ from{ opacity:0; transform:translateY(18px) scale(.97); } to{ opacity:1; transform:translateY(0) scale(1); } }

  .term-bar{
    display:flex; align-items:center; gap:8px; padding:11px 14px;
    background:var(--panel-2); border-bottom:1px solid var(--border);
  }
  .dot{ width:10px; height:10px; border-radius:2px; background:#3a424c; transition:background .3s; }
  .term:hover .dot:nth-child(1){ background:#7a4a4a; }
  .term:hover .dot:nth-child(2){ background:#7a6f4a; }
  .term:hover .dot:nth-child(3){ background:var(--ok); }
  .term-path{ margin-left:8px; font-size:11px; color:var(--text-faint); flex:1; text-align:center; letter-spacing:.04em; }
  .term-meta{ font-size:10px; color:var(--text-faint); font-variant-numeric:tabular-nums; display:flex; gap:10px; }
  .term-meta .views::before{ content:"◆ "; color:var(--accent); }

  .term-body{ padding:22px 20px 18px; min-height:120px; }

  #boot{ font-size:12px; line-height:2; color:var(--text-dim); }
  #boot .line{ opacity:0; animation:appear .3s forwards; }
  #boot .ok{ color:var(--ok); }
  @keyframes appear{ to{opacity:1;} }

  #profile{ display:none; }
  #profile.show{ display:block; animation:appear .45s ease both; }

  .head{ display:flex; gap:14px; align-items:flex-start; margin-bottom:16px; }
  .avatar-wrap{ position:relative; flex-shrink:0; }
  .avatar-ring{
    position:absolute; inset:-3px; border-radius:8px; border:1px solid var(--accent);
    opacity:.5; animation:ringpulse 2.6s ease-in-out infinite;
  }
  @keyframes ringpulse{ 0%,100%{ transform:scale(1); opacity:.45; } 50%{ transform:scale(1.08); opacity:0; } }
  .avatar{
    position:relative; width:56px; height:56px; border-radius:6px;
    border:1px solid var(--border); object-fit:cover; display:block;
    background:var(--panel-2); image-rendering:pixelated;
  }

  .id-block{ min-width:0; flex:1; }
  .name-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .name{ font-size:20px; font-weight:700; color:var(--text); animation:fadeslide .4s ease .05s both; }
  @keyframes fadeslide{ from{ opacity:0; transform:translateX(-6px);} to{ opacity:1; transform:translateX(0);} }

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700;
    color:var(--text-dim); background:var(--panel-2); border:1px solid var(--border);
    padding:3px 8px 3px 6px; border-radius:3px; animation:fadeslide .4s ease .12s both;
  }
  .badge.b-vacation .pulse{ width:6px; height:6px; border-radius:1px; background:var(--ok); animation:pulse 2s infinite; }
  .badge.b-java{ color:#e3a857; border-color:#4a3a24; }
  .badge.b-mc{ color:#7fbf8f; border-color:#2e4a34; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(127,191,143,.45); }
    70%{ box-shadow:0 0 0 6px rgba(127,191,143,0); }
    100%{ box-shadow:0 0 0 0 rgba(127,191,143,0); }
  }

  .role{ margin-top:7px; font-size:12px; color:var(--accent); min-height:18px; }
  .role .cursor-blink{ display:inline-block; width:7px; background:var(--accent); margin-left:1px; animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .about{
    font-size:12px; color:var(--text-dim); line-height:1.9; margin:14px 0 16px;
    padding-left:12px; border-left:2px solid var(--border);
    animation:fadeslide .4s ease .18s both;
  }
  .about b{ color:var(--text); font-weight:700; }

  /* ---- music player ---- */
  .player{
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    padding:10px 12px; margin-bottom:16px;
    animation:fadeslide .4s ease .22s both;
  }
  .player-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .player-note{
    flex-shrink:0; width:14px; height:14px;
    background-color:var(--accent);
    -webkit-mask-image:url('assets/icons/note.png'); mask-image:url('assets/icons/note.png');
    -webkit-mask-size:contain; mask-size:contain;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    transition: background-color .2s ease;
    /* animation is always attached and simply paused/resumed, so pausing
       freezes the note mid-rotation instead of snapping back to 0deg */
    animation:spin 2.4s linear infinite;
    animation-play-state:paused;
  }
  .player-note.spin{ animation-play-state:running; }
  @keyframes spin{ from{transform:rotate(0);} to{transform:rotate(360deg);} }
  /* very old browsers without CSS mask support: fall back to the plain
     (untinted) icon image instead of an invisible element */
  @supports not ((mask-image: url(a.png)) or (-webkit-mask-image: url(a.png))){
    .player-note{
      background-color:transparent; background-image:url('assets/icons/note.png');
      background-size:contain; background-repeat:no-repeat; background-position:center;
    }
  }
  .player-meta{ min-width:0; flex:1; overflow:hidden; }
  .player-title{ font-size:11.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:opacity .18s ease; }
  .player-artist{ font-size:10px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:opacity .18s ease; }
  .player-btns{ display:flex; gap:4px; flex-shrink:0; }

  .pbtn{
    position:relative;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid var(--border); border-radius:4px;
    color:var(--text-dim); cursor:pointer; padding:0;
    transition:border-color .18s var(--ease), color .18s var(--ease), transform .18s var(--ease), background-color .18s var(--ease);
  }
  .pbtn:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); transform:translateY(-1px); }
  .pbtn:active{ transform:translateY(0) scale(.94); }
  .pbtn svg{ width:11px; height:11px; }

  /* custom tooltip for player controls — replaces native title bubble */
  .pbtn .ptip{
    position:absolute; bottom:calc(100% + 7px); left:50%; transform:translateX(-50%) translateY(3px);
    background:var(--panel); border:1px solid var(--border); color:var(--text-dim);
    font-size:9px; letter-spacing:.03em; white-space:nowrap; padding:4px 7px; border-radius:4px;
    opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease;
    box-shadow:0 6px 16px -6px rgba(0,0,0,.6);
  }
  .pbtn .ptip::after{
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:4px solid transparent; border-top-color:var(--border);
  }
  .pbtn:hover .ptip, .pbtn:focus-visible .ptip{ opacity:1; transform:translateX(-50%) translateY(0); color:var(--accent); }

  .player-bottom{ display:flex; align-items:center; gap:8px; }
  .p-time{ font-size:9px; color:var(--text-faint); width:30px; flex-shrink:0; font-variant-numeric:tabular-nums; }
  .p-time.end{ text-align:right; }
  .p-bar{
    flex:1; height:4px; background:var(--border); border-radius:2px; position:relative; cursor:pointer;
  }
  .p-bar:hover{ height:6px; }
  .p-fill{ position:absolute; inset:0; width:0%; background:var(--accent); border-radius:2px; transition:width .1s linear; }
  .p-vol{ width:44px; accent-color:var(--accent); }

  /* the input line reads as its own clearly-bounded box now — a subtle panel
     with padding, so it's obvious where typing happens vs. the history above it */
  .prompt-line{
    display:flex; align-items:center; gap:10px;
    margin-top:14px; padding:9px 11px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    font-size:12px;
    transition: border-color .18s var(--ease), background-color .18s var(--ease);
  }
  .prompt-line:focus-within{ border-color:var(--accent); background:var(--accent-soft); }
  .prompt-tag{ color:var(--accent); flex-shrink:0; white-space:nowrap; }
  .prompt-line input{
    flex:1; min-width:0; background:transparent; border:none; outline:none;
    color:var(--text); font-family:inherit; font-size:12px; caret-color:var(--accent);
    padding-left:2px; /* small indent so the caret never sits flush against the $ tag */
  }
  .prompt-line input::placeholder{ color:var(--text-faint); }

  /* history stays compact and gets its own themed scrollbar instead of the
     bulky default browser one, so a long command history never eats the layout */
  #console-out{
    font-size:11px; color:var(--text-dim); line-height:1.9;
    max-height:0; overflow:hidden; transition:max-height .3s var(--ease);
  }
  #console-out.open{
    max-height:170px; overflow-y:auto; margin-top:10px; padding:0 8px 2px 0;
    scrollbar-width:thin; scrollbar-color:var(--border) transparent;
  }
  #console-out.open::-webkit-scrollbar{ width:5px; }
  #console-out.open::-webkit-scrollbar-track{ background:transparent; }
  #console-out.open::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
  #console-out.open::-webkit-scrollbar-thumb:hover{ background:var(--accent); }
  #console-out .c-line{ white-space:pre-wrap; animation:appear .2s ease; padding:1px 0; }
  #console-out .c-cmd{ color:var(--text); }
  #console-out .c-cmd::before{ content:"guest@qweyns:~$ "; color:var(--accent); }
  #console-out a{ color:var(--accent); }

  .socials{ display:flex; gap:10px; opacity:0; animation:fadeslide .4s ease .6s both; }
  .social-btn{
    width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    text-decoration:none; position:relative;
    transition:transform .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  /* icons pre-trimmed to equal visual weight; fixed box keeps them reading as the same size */
  .social-btn img{ width:23px; height:23px; display:block; object-fit:contain; }
  .social-btn:hover, .social-btn:focus-visible{
    transform:translateY(-3px); border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent), 0 10px 20px -8px rgba(227,168,87,.5);
    outline:none;
  }
  .social-btn .tip{
    position:absolute; bottom:-20px; left:50%; transform:translateX(-50%);
    font-size:9px; color:var(--text-faint); opacity:0; transition:opacity .15s ease;
    white-space:nowrap; pointer-events:none;
  }
  .social-btn:hover .tip{ opacity:1; }

  .foot{ text-align:center; font-size:9px; color:var(--text-faint); margin-top:8px; }
  .foot .konami-hint{ opacity:.5; }
  .restore-ad-btn{
    background:none; border:none; color:var(--text-faint); font-family:inherit;
    font-size:9px; cursor:pointer; padding:0; margin-left:2px; text-decoration:underline;
    text-underline-offset:2px; transition:color .15s ease;
  }
  .restore-ad-btn:hover{ color:var(--accent); }

  /* ---- ad panel ---- */
  .ad-panel{
    width:190px; flex-shrink:0; background:var(--panel);
    border:1px solid var(--border); padding:12px; position:relative;
    animation:rise-in .6s var(--ease) .1s both;
    opacity:1; transform:scale(1) translateX(0);
    transition: opacity .4s var(--ease), transform .4s var(--ease), width .4s var(--ease),
                padding .4s var(--ease), border-color .4s var(--ease), margin .4s var(--ease);
    overflow:hidden;
  }
  .ad-panel::before, .ad-panel::after{ content:""; position:absolute; width:6px; height:6px; background:var(--accent); opacity:.7; }
  .ad-panel::before{ top:-1px; left:-1px; }
  .ad-panel::after{ bottom:-1px; right:-1px; }
  .ad-panel.closing{
    opacity:0; transform:scale(.9) translateX(-8px);
    width:0; padding:12px 0; margin:0; border-color:transparent;
    pointer-events:none;
  }
  /* single source of truth for "fully dismissed" — no attribute/selector
     specificity race with the responsive display rules below */
  .ad-panel.is-dismissed{ display:none !important; }

  .ad-close{
    position:absolute; top:6px; right:6px; width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid var(--border); color:var(--text-faint);
    cursor:pointer; padding:0; border-radius:3px; font-size:11px; line-height:1;
    transition:border-color .15s ease, color .15s ease, transform .15s ease;
  }
  .ad-close:hover{ border-color:var(--accent); color:var(--accent); transform:rotate(90deg); }

  .ad-tag{ display:flex; align-items:center; gap:6px; font-size:9px; color:var(--text-faint); letter-spacing:.08em; margin-bottom:12px; padding-right:16px; }
  .ad-tag .blink-dot{ width:5px; height:5px; background:var(--accent); animation:blink 1.1s step-end infinite; flex-shrink:0; }
  .ad-tag .ad-dots{ display:flex; gap:3px; margin-left:auto; }
  .ad-tag .ad-dot{ width:4px; height:4px; border-radius:1px; background:var(--border); transition:background .3s ease; }
  .ad-tag .ad-dot.on{ background:var(--accent); }

  .ad-slot{ position:relative; min-height:172px; }
  .ad-item{
    position:absolute; inset:0;
    opacity:0; transform:translateY(6px);
    transition: opacity .4s var(--ease), transform .4s var(--ease);
    pointer-events:none; z-index:1;
  }
  .ad-item.active{ opacity:1; transform:translateY(0); pointer-events:auto; z-index:2; }
  .ad-item.leaving{ opacity:0; transform:translateY(-6px); pointer-events:none; z-index:1; }

  .ad-icon{ width:34px; height:34px; margin-bottom:10px; background-color:var(--accent); }
  .ad-icon.mask{
    -webkit-mask-size:contain; mask-size:contain;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
  }
  @supports not ((mask-image: url(a.png)) or (-webkit-mask-image: url(a.png))){
    .ad-icon.mask{
      background-color:transparent; background-image:var(--icon-src);
      background-size:contain; background-repeat:no-repeat; background-position:center;
    }
  }
  .ad-title{ font-size:13px; color:var(--text); margin-bottom:6px; line-height:1.5; }
  .ad-body{ font-size:10.5px; color:var(--text-dim); line-height:1.7; margin-bottom:12px; }
  .ad-cta{
    display:inline-flex; align-items:center; gap:6px; font-size:10.5px; color:var(--bg);
    background:var(--accent); padding:7px 10px; text-decoration:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .ad-cta:hover{ opacity:.85; transform:translateX(2px); }

  @media (min-width:900px){ .ad-panel{ width:190px; display:block; } }

  /* mobile: instead of hiding the ad entirely, stack it as a full-width
     card below the terminal — compact enough not to dominate the screen */
  @media (max-width:899px){
    .stage{ flex-direction:column; align-items:center; }
    .stage.ad-closed{ gap:16px; }
    .main-col{ max-width:100%; }
    .ad-panel{ width:100%; max-width:560px; box-sizing:border-box; }
    .ad-slot{ min-height:118px; }
    .ad-icon{ width:26px; height:26px; margin-bottom:7px; }
    .ad-title{ font-size:12.5px; }
    .ad-body{ font-size:10px; margin-bottom:9px; }
  }

  /* ---- achievement toast ---- */
  #toast-wrap{ position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:10000; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast{
    background:var(--panel); border:1px solid var(--accent); border-radius:6px;
    padding:10px 16px; display:flex; align-items:center; gap:10px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.6);
    animation:toastin .4s var(--ease) both, toastout .4s ease 3.2s both;
  }

/* ============================================================
   tiny synthesized sounds — no audio files needed
   ============================================================ */
let actx;
function beep(freq, dur, vol, type){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.03;
    osc.connect(gain); gain.connect(actx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    osc.stop(actx.currentTime + dur);
  }catch(e){}
}
function keySound(){ beep(320 + Math.random()*160, 0.045, 0.025, 'square'); }
function clickSound(){ beep(520, 0.06, 0.03, 'square'); }
function successSound(){ beep(660, 0.08, 0.04, 'triangle'); setTimeout(()=>beep(880,0.12,0.04,'triangle'), 90); }

/* ============================================================

(function spawnParticles(){

  const count = reduced ? 0 : (window.innerWidth < 640 ? 12 : 22);

/* ============================================================
   mouse trail — canvas based (one element, no per-frame DOM writes)
   ============================================================ */
(function mouseTrail(){
  const canvas = $('#trail');
  const ctx = canvas.getContext('2d');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let dots = [];
  let raf = null;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize, { passive:true });

  if (reduced) return;

  let last = 0;
  window.addEventListener('mousemove', (e) => {
    const now = performance.now();
    if (now - last < 30) return;
    last = now;
    dots.push({ x:e.clientX, y:e.clientY, t:now });
    if (dots.length > 40) dots.shift();
    if (!raf) raf = requestAnimationFrame(draw);
  }, { passive:true });

  function draw(){
    raf = null;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const now = performance.now();
    dots = dots.filter(d => now - d.t < 600);
    for (const d of dots){
      const age = (now - d.t) / 600;
      const alpha = (1 - age) * 0.8;
      const size = 4 * (1 - age * 0.7);
      ctx.fillStyle = `rgba(227,168,87,${alpha})`;
      ctx.fillRect(d.x - size/2, d.y - size/2, size, size);
    }
    if (dots.length) raf = requestAnimationFrame(draw);
  }
})();

/* 3D tilt on terminal — rAF batched to avoid layout thrash */
(function tilt(){
  const term = $('#term');
  let targetX = 0, targetY = 0, curX = 0, curY = 0, raf = null;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;

  function loop(){
    curX += (targetX - curX) * 0.15;
    curY += (targetY - curY) * 0.15;
    term.style.transform = `perspective(900px) rotateY(${curX}deg) rotateX(${curY}deg)`;
    if (Math.abs(targetX-curX) > 0.01 || Math.abs(targetY-curY) > 0.01){
      raf = requestAnimationFrame(loop);
    } else { raf = null; }
  }
  term.addEventListener('mousemove', (e) => {
    const r = term.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    targetX = px * 4; targetY = -py * 4;
    if (!raf) raf = requestAnimationFrame(loop);
  }, { passive:true });
  term.addEventListener('mouseleave', () => {
    targetX = 0; targetY = 0;
    if (!raf) raf = requestAnimationFrame(loop);
  });
})();

   social icons — real uploaded artwork, trimmed to equal visual size

(function renderSocials(){

/* ============================================================
   rotating ad panel — self-promo slots, closeable
   ============================================================ */
(function ads(){
  const panel = $('#adPanel');
  const slot = $('#adSlot');
  const dotsWrap = $('#adDots');
  const closeBtn = $('#adClose');
  const stage = $('#stage');
  let idx = 0, timer = null;

  // localStorage can throw (private-mode Safari, disabled storage, etc.) —
  // never let a storage failure break the ad panel or the rest of the page.
  function storageGet(key){
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function storageSet(key, val){
    try { localStorage.setItem(key, val); } catch (e) { /* ignore — non-critical */ }
  }

  const closedBefore = storageGet('qweyns_ad_closed') === '1';
  const restoreBtn = $('#restoreAdBtn');
  if (closedBefore){
    panel.classList.add('is-dismissed');
    stage.classList.add('ad-closed');
    if (restoreBtn) restoreBtn.hidden = false;
  }

  function renderItem(ad){
    const el = document.createElement('div');
    el.className = 'ad-item';
    const icon = ad.iconMask
      ? `<div class="ad-icon mask" style="-webkit-mask-image:url('${ad.iconMask}');mask-image:url('${ad.iconMask}');--icon-src:url('${ad.iconMask}');"></div>`
      : `<div class="ad-icon" style="background:none;">${ad.iconSvg}</div>`;
    el.innerHTML = `
      ${icon}
      <div class="ad-title">${ad.title}</div>
      <div class="ad-body">${ad.body}</div>
      <a class="ad-cta" href="${ad.url}" target="_blank" rel="noopener noreferrer">${ad.ctaText}</a>
    `;
    return el;
  }

  function renderDots(){
    dotsWrap.innerHTML = '';
    CONFIG.ads.forEach((_, i) => {
      const d = document.createElement('span');
      d.className = 'ad-dot' + (i === idx ? ' on' : '');
      dotsWrap.appendChild(d);
    });
  }

  let currentEl = null;
  function show(i){
    idx = i;
    const prevEl = currentEl;
    const el = renderItem(CONFIG.ads[idx]);
    slot.appendChild(el);
    currentEl = el;

    // true crossfade: new card fades/slides in while the old one fades/slides out,
    // both present at once instead of an instant swap.
    requestAnimationFrame(() => {
      el.classList.add('active');
      if (prevEl){
        prevEl.classList.remove('active');
        prevEl.classList.add('leaving');
        setTimeout(() => prevEl.remove(), 420);
      }
    });
    renderDots();
  }

  function next(){ show((idx + 1) % CONFIG.ads.length); }

  function startRotation(){
    stopRotation();
    timer = setInterval(next, CONFIG.adRotateMs);
  }
  function stopRotation(){ if (timer) clearInterval(timer); timer = null; }

  function openAds(){
    panel.classList.remove('is-dismissed', 'closing');
    stage.classList.remove('ad-closed');
    if (restoreBtn) restoreBtn.hidden = true;
    show(idx);
    startRotation();
  }

  if (!closedBefore){
    show(0);
    startRotation();
  }
  panel.addEventListener('mouseenter', stopRotation);
  panel.addEventListener('mouseleave', () => { if (!panel.classList.contains('is-dismissed')) startRotation(); });

  closeBtn.addEventListener('click', () => {
    clickSound();
    stopRotation();
    panel.classList.add('closing');
    stage.classList.add('ad-closed');
    storageSet('qweyns_ad_closed', '1');
    if (restoreBtn) restoreBtn.hidden = false;
    setTimeout(() => panel.classList.add('is-dismissed'), 420);
  });

  if (restoreBtn){
    restoreBtn.addEventListener('click', () => {
      clickSound();
      storageSet('qweyns_ad_closed', '0');
      openAds();
    });
  }
})();

/* ============================================================
   boot sequence
   ============================================================ */
const bootLines = [
  'ssh guest@qweyns.dev',
  `Last login: ${new Date().toDateString()}`,

];
function playBoot(){
  const el = $('#boot');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced){ revealProfile(); return; }
  let i = 0;
  function next(){
    if (i >= bootLines.length){ setTimeout(revealProfile, 250); return; }
    const line = document.createElement('div');
    line.className = 'line';
    line.innerHTML = (i === 0 ? '<span style="color:var(--text-dim)">$ </span>' : '') + bootLines[i];
    el.appendChild(line);
    i++;
    setTimeout(next, i === 1 ? 250 : 180);
  }
  next();
}
function revealProfile(){
  $('#boot').style.display = 'none';
  $('#profile').classList.add('show');
  startRoleTyping();
}
function startRoleTyping(){
  const el = $('#role');
  const roles = CONFIG.roles;
  let ri = 0, ci = 0, deleting = false;
  function frame(){
    const word = roles[ri];
    if (!deleting){ ci++; if (ci > word.length){ deleting = true; setTimeout(frame, 1400); return; } }
    else { ci--; if (ci < 0){ deleting = false; ri = (ri + 1) % roles.length; ci = 0; } }
    el.innerHTML = word.slice(0, ci) + '<span class="cursor-blink"></span>';
    setTimeout(frame, deleting ? 35 : 65);
  }
  frame();
}

/* ============================================================
   music player
   ============================================================ */
const audio = $('#audio');
let trackIndex = 0, isPlaying = false, audioErrorStreak = 0;
function fmt(t){ if (!isFinite(t)) return '0:00'; const m = Math.floor(t/60), s = Math.floor(t%60); return `${m}:${String(s).padStart(2,'0')}`; }
function loadTrack(i, autoplay){
  trackIndex = (i + CONFIG.tracks.length) % CONFIG.tracks.length;
  const t = CONFIG.tracks[trackIndex];
  const meta = $('.player-meta');
  meta.style.opacity = '0';
  setTimeout(() => {
    audio.src = t.src;
    $('#pTitle').textContent = t.title;
    $('#pArtist').textContent = t.artist;
    $('#pFill').style.width = '0%';
    $('#pCur').textContent = '0:00';
    meta.style.opacity = '1';
  }, 120);
  if (autoplay) audio.play().catch(()=>{});
}
function setPlaying(p){
  isPlaying = p;
  $('#pPlay').innerHTML = (p
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>')
    + `<span class="ptip">${p ? 'pause' : 'play'}</span>`;
  $('#playerNote').classList.toggle('spin', p);
}
loadTrack(0, false);
audio.volume = 0.55;
$('#pPlay').addEventListener('click', () => { clickSound(); if (isPlaying){ audio.pause(); } else { audio.play().catch(()=>{}); } });
$('#pNext').addEventListener('click', () => { clickSound(); loadTrack(trackIndex+1, true); });
$('#pPrev').addEventListener('click', () => { clickSound(); loadTrack(trackIndex-1, true); });
audio.addEventListener('play', () => setPlaying(true));
audio.addEventListener('pause', () => setPlaying(false));
audio.addEventListener('ended', () => {
  audioErrorStreak = 0;
  unlock('full_listen', 'Full Listen', 'Stuck around for an entire track.');
  loadTrack(trackIndex+1, true);
});
audio.addEventListener('timeupdate', () => {
  $('#pCur').textContent = fmt(audio.currentTime);
  $('#pDur').textContent = fmt(audio.duration);
  $('#pFill').style.width = (audio.duration ? (audio.currentTime/audio.duration*100) : 0) + '%';
});
// a missing/broken mp3 file shouldn't just go silent — surface it, then
// try the next track once instead of getting stuck forever.
audio.addEventListener('error', () => {
  $('#pTitle').textContent = 'Track unavailable';
  $('#pArtist').textContent = 'skipping to next…';
  setPlaying(false);
  audioErrorStreak++;
  if (audioErrorStreak < CONFIG.tracks.length){
    setTimeout(() => loadTrack(trackIndex+1, true), 900);
  } else {
    $('#pArtist').textContent = 'no playable tracks found';
  }
});
$('#pBar').addEventListener('click', (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  const ratio = (e.clientX - r.left) / r.width;
  if (isFinite(audio.duration)) audio.currentTime = ratio * audio.duration;
});
$('#pVol').addEventListener('input', (e) => { audio.volume = e.target.value / 100; });

/* ============================================================
   achievements / toasts
   ============================================================ */
function storageGetGlobal(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
function storageSetGlobal(key, val){ try { localStorage.setItem(key, val); } catch(e){ /* ignore */ } }

const unlocked = new Set(JSON.parse(storageGetGlobal('qweyns_achievements') || '[]'));
function unlock(id, title, desc){
  if (unlocked.has(id)) return;
  unlocked.add(id);
  storageSetGlobal('qweyns_achievements', JSON.stringify([...unlocked]));
  successSound();
  const wrap = $('#toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<div class="toast-icon"></div><div class="toast-text"><b>ACHIEVEMENT GET!</b>${title}<br><span style="color:var(--text-faint)">${desc}</span></div>`;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 3600);
}

/* spent 5+ minutes on the page */
setTimeout(() => unlock('lingered', 'Making Yourself at Home', "Spent 5 minutes here. It's a nice terminal, isn't it."), 5 * 60 * 1000);

/* clicked every social link at least once */
const openedSocials = new Set();

  openedSocials.add(key);
  if (openedSocials.size >= CONFIG.links.length){
    unlock('all_socials', 'Well Connected', 'Checked out every social link.');
  }
}

/* konami code easter egg */
(function konami(){
  const seq = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let pos = 0;
  window.addEventListener('keydown', (e) => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (key === seq[pos]) {
      pos++;
      if (pos === seq.length){
        pos = 0;
        unlock('konami', 'Konami Code', 'You really typed that in. Respect.');
        openGame();
      }
    } else {
      pos = (key === seq[0]) ? 1 : 0;
    }
  });
})();

/* ============================================================
   mini game: Smash The Egg
   ============================================================ */
const gameOverlay = $('#game-overlay');
const gameField = $('#game-field');
let gameTimer = null, gameActive = false, score = 0, timeLeft = 15;
const bestKey = 'qweyns_smashegg_best';
$('#gBest').textContent = storageGetGlobal(bestKey) || '0';

function openGame(){ gameOverlay.classList.add('open'); }
function closeGame(){ gameOverlay.classList.remove('open'); stopGame(); }
$('#gameClose').addEventListener('click', () => { clickSound(); closeGame(); });
$('#gameStart').addEventListener('click', () => { clickSound(); startGame(); });

function stopGame(){
  gameActive = false;
  clearInterval(gameTimer);
  gameField.innerHTML = '';
}
function startGame(){
  stopGame();
  score = 0; timeLeft = 15; gameActive = true;
  $('#gScore').textContent = score;
  $('#gTime').textContent = timeLeft;
  spawnEgg();
  gameTimer = setInterval(() => {
    timeLeft--;
    $('#gTime').textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);
}
function spawnEgg(){
  if (!gameActive) return;
  gameField.querySelectorAll('.egg').forEach(e => e.remove());
  const egg = document.createElement('div');
  egg.className = 'egg';
  egg.innerHTML = `<svg viewBox="0 0 8 8" width="28" height="28"><rect x="2" y="0" width="4" height="1" fill="#e3a857"/><rect x="1" y="1" width="6" height="1" fill="#e3a857"/><rect x="0" y="2" width="8" height="4" fill="#e3a857"/><rect x="1" y="6" width="6" height="1" fill="#e3a857"/><rect x="2" y="7" width="4" height="1" fill="#e3a857"/></svg>`;
  const fw = gameField.clientWidth - 30, fh = gameField.clientHeight - 30;
  egg.style.left = (Math.random() * fw) + 'px';
  egg.style.top = (Math.random() * fh) + 'px';
  egg.addEventListener('click', () => {
    score++; $('#gScore').textContent = score;
    beep(700 + score*8, 0.05, 0.03, 'square');
    spawnEgg();
  });
  gameField.appendChild(egg);
  clearTimeout(spawnEgg._t);
  spawnEgg._t = setTimeout(() => { if (gameActive) spawnEgg(); }, 900);
}
function endGame(){
  gameActive = false;
  clearInterval(gameTimer);
  gameField.innerHTML = '';
  const best = parseInt(storageGetGlobal(bestKey) || '0', 10);
  if (score > best){
    storageSetGlobal(bestKey, String(score));
    $('#gBest').textContent = score;
    unlock('smashegg_best', 'New High Score', `Smashed ${score} eggs in 15 seconds.`);
  }
  if (score >= 15) unlock('smashegg_pro', 'Egg Smasher Pro', 'Scored 15+ in Smash The Egg.');
}

/* ============================================================
   mini console
   ============================================================ */
const out = $('#console-out');
const input = $('#cmdInput');
function printLine(html){
  const d = document.createElement('div');
  d.className = 'c-line';
  d.innerHTML = html;
  out.appendChild(d);
  out.classList.add('open');
  out.scrollTop = out.scrollHeight;
}
const COMMANDS = {
  help: () => `available: help, links, about, github, telegram, discord, play, achievements, clear`,
  links: () => CONFIG.links.map(l => `${l.label.padEnd(9,' ')} ${l.url}`).join('\n'),
  about: () => `Java dev. Minecraft plugins: spawners, mascots, NPCs. Currently on vacation.`,
  github: () => { window.open(CONFIG.links.find(l=>l.key==='github').url, '_blank'); return 'opening github…'; },
  telegram: () => { window.open(CONFIG.links.find(l=>l.key==='telegram').url, '_blank'); return 'opening telegram…'; },
  discord: () => { window.open(CONFIG.links.find(l=>l.key==='discord').url, '_blank'); return 'opening discord…'; },
  play: () => { openGame(); unlock('found_game', 'Secret Found', "You typed 'play' — found the mini-game."); return 'launching Smash The Egg…'; },
  achievements: () => unlocked.size ? [...unlocked].join(', ') : 'none yet — try the konami code, or type "play"',
  clear: () => { out.innerHTML=''; out.classList.remove('open'); return null; },
  sudo: () => { unlock('sudo', 'Nice Try', "guest tried to sudo. Denied, but noted."); return `permission denied: guest is not in the sudoers file. this incident will be reported.`; },
  whoami: () => `guest — but the links above will introduce you properly`,
};
input.addEventListener('keydown', (e) => {
  keySound();
  if (e.key !== 'Enter') return;
  const raw = input.value.trim();
  if (!raw) return;
  printLine(`<span class="c-cmd">${raw}</span>`);
  const cmd = raw.toLowerCase().split(' ')[0];
  const handler = COMMANDS[cmd];
  if (handler){
    const res = handler();
    if (res) printLine(res.replace(/\n/g,'<br>'));
  } else {
    printLine(`command not found: ${cmd} — try 'help'`);
  }
  input.value = '';
});

playBoot();
</script>
