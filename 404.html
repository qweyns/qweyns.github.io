<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>404 — qweyns</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d11">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icons/favicon-512.png">

<script>
  /* mirrors the same saved-theme choice from the main site so landing here
     from a dead link doesn't jump to a different palette — no switcher UI
     here on purpose, this page stays deliberately minimal */
  (function(){
    try{
      var t = localStorage.getItem('qweyns_theme');
      var valid = ['amber','pink','cyan','black'];
      if (t && valid.indexOf(t) !== -1) document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>

<style>
  @font-face{
    font-family:'MinecraftFive';
    src:url('assets/fonts/MinecraftFiveBold.otf') format('opentype');
    font-weight:700; font-style:normal; font-display:swap;
  }

  :root{
    --bg:            #0b0d11;
    --panel:         #12151c;
    --border:        #2a3138;
    --border-soft:   #232830;
    --text:          #e4eaef;
    --text-dim:      #93a8b5;
    --text-faint:    #5b6d78;
    --accent:        #bef264;
    --shadow-rgb:    0,0,0;
    --ease: cubic-bezier(.22,.85,.32,1);
    color-scheme: dark;
  }
  [data-theme="amber"]{ --accent:#e3a857; }
  [data-theme="pink"]{ --accent:#f9a8d4; }
  [data-theme="cyan"]{ --accent:#38bdf8; }
  [data-theme="black"]{
    --bg:#000000; --panel:#0a0a0a; --border:#242424; --border-soft:#1b1b1b;
    --text:#f4f4f5; --text-dim:#9a9a9f; --text-faint:#5c5c61; --accent:#f4f4f5;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'MinecraftFive', ui-monospace, monospace;
    -webkit-font-smoothing:none; font-smooth:never; letter-spacing:.02em;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px; position:relative; overflow-x:hidden;
    transition:background-color .3s var(--ease), color .3s var(--ease);
  }
  html{ scrollbar-width:thin; scrollbar-color:var(--border) var(--bg); }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:var(--border); border:2px solid var(--bg); background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--accent); }

  /* same quiet backdrop as the main site, so this still reads as the same
     place — just without anything on top competing for attention */
  .bg-grid{
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size:42px 42px; opacity:.3;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 90%);
    pointer-events:none;
  }
  .bg-vignette{
    position:fixed; inset:0;
    background:radial-gradient(ellipse 90% 80% at 50% 40%, transparent 55%, rgba(var(--shadow-rgb),.45) 100%);
    pointer-events:none;
  }

  /* one quiet entrance for the whole card — no typed boot sequence, no
     staged reveal. someone landing on a dead link wants the answer
     immediately, not a second loading show. */
  .term{
    position:relative; width:100%; max-width:420px;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 30px 80px -20px rgba(var(--shadow-rgb),.6), 0 0 0 1px rgba(255,255,255,.02) inset;
    padding:30px 26px 26px; text-align:center;
    animation:settle .35s var(--ease) both;
  }
  @keyframes settle{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

  .dots{ display:flex; gap:6px; justify-content:center; margin-bottom:22px; }
  .dot{ width:8px; height:8px; border-radius:2px; background:#3a424c; }

  .cmd-line{
    text-align:left; font-size:11px; line-height:1.8; color:var(--text-faint);
    margin-bottom:20px;
  }
  .cmd-line .prompt{ color:var(--text-dim); }
  .cmd-line .path{ color:var(--text); word-break:break-all; }
  .cmd-line .err{ color:#ef7373; }

  .code404{
    font-size:52px; font-weight:700; color:var(--accent); line-height:1;
    letter-spacing:.04em; margin-bottom:14px;
  }
  .code404 .cursor{
    display:inline-block; width:8px; height:.8em; background:var(--accent);
    margin-left:4px; vertical-align:-2px; animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .code404 .cursor{ animation:none; opacity:1; } }

  .msg{ font-size:12px; color:var(--text-dim); line-height:1.7; margin-bottom:24px; }

  .home-cta{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--accent); color:var(--bg); text-decoration:none;
    font-size:12px; font-weight:700; padding:10px 20px; border-radius:6px;
    transition:opacity .15s ease, transform .15s ease;
  }
  .home-cta:hover{ opacity:.85; transform:translateY(-1px); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
  @media (max-width:480px){
    .term{ padding:24px 20px 22px; }
    .code404{ font-size:42px; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-vignette"></div>

<div class="term">
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

  <div class="cmd-line">
    <span class="prompt">guest@qweyns:~$</span> cd <span class="path" id="pathText">/unknown</span><br>
    <span class="err">bash: cd: no such file or directory</span>
  </div>

  <div class="code404">404<span class="cursor"></span></div>
  <div class="msg">This page doesn't exist. Wrong link, or it moved.</div>

  <a class="home-cta" href="/">← back to qweyns.github.io</a>
</div>

<script>
  document.getElementById('pathText').textContent = location.pathname || '/unknown';
</script>
</body>
</html>
